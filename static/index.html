<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Local LLM Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <div><h1>Local LLM</h1><small id="status">Connecting to Ollama…</small></div>
      <nav>
        <label for="model">Model</label>
        <select id="model"></select>
        <button id="clear" class="secondary">New chat</button>
      </nav>
    </header>
    <section id="messages" aria-live="polite">
      <div class="empty">
        <h2>What would you like to explore?</h2>
        <p>This chat stays on your computer and uses your local Ollama service.</p>
      </div>
    </section>
    <footer>
      <form id="composer">
        <textarea id="prompt" rows="1" aria-label="Message" placeholder="Message your local model" required></textarea>
        <button id="send">Send</button><button id="stop" class="secondary hidden" type="button">Stop</button>
      </form>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
